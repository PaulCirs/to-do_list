# Pipeline CI : à chaque push ou pull request, GitHub lance ces jobs sur une machine virtuelle.
#   1. test  : lint (ruff) + tests (pytest) de l'API
#   2. build : construit les images Docker, et les publie sur ghcr.io (seulement sur main)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip                                   # garde les paquets téléchargés entre deux runs
          cache-dependency-path: api/requirements*.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -v

  build:
    needs: test               # ne construit les images que si les tests sont passés
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write         # autorise le push d'images sur ghcr.io
    strategy:
      matrix:                 # le job tourne 2 fois en parallèle : une fois par image
        component: [api, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Connexion à ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # jeton fourni automatiquement par GitHub

      - name: Calcul des tags de l'image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.component }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (et push sur main)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          push: ${{ github.event_name == 'push' }}   # sur une pull request : build seulement
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

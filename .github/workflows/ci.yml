# Pipeline CI : à chaque push ou pull request, GitHub lance ces jobs sur une machine virtuelle.
#   1. test  : lint (ruff) + tests (pytest) de l'API
#   2. build : construit les images Docker, vérifie qu'elles démarrent (smoke test),
#              puis les publie sur ghcr.io (seulement sur main)
#   3. deploy : écrit le tag de ces nouvelles images dans k8s/app/ et le commite sur main
#               (seulement sur main) → Argo CD voit le changement et déploie
name: CI

on:
  push:
    branches: [main]
    # Un commit qui ne touche que k8s/ (ex. changer "replicas") ne change pas le code :
    # inutile de reconstruire les images, Argo CD appliquera directement le YAML.
    paths-ignore: ["k8s/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["k8s/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip                                   # garde les paquets téléchargés entre deux runs
          cache-dependency-path: api/requirements*.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -v

  build:
    needs: test               # ne construit les images que si les tests sont passés
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write         # autorise le push d'images sur ghcr.io
    strategy:
      matrix:                 # le job tourne 2 fois en parallèle : une fois par image
        include:
          - component: api
            port: 8000        # port sur lequel l'appli écoute dans le conteneur
            check: /health    # URL appelée par le smoke test
          - component: frontend
            port: 80
            check: /
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Connexion à ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # jeton fourni automatiquement par GitHub

      - name: Calcul des tags de l'image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.component }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build de l'image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          load: true                                  # garde l'image sur la machine pour le smoke test
          tags: smoke-test:${{ matrix.component }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      # Smoke test : on démarre vraiment l'image et on vérifie qu'elle répond.
      # (--add-host : nginx refuse de démarrer s'il ne trouve pas l'hôte "api" de sa config ;
      #  on le fait pointer vers le conteneur lui-même, juste pour le test)
      - name: Smoke test (l'image démarre-t-elle ?)
        run: |
          docker run -d --name smoke --add-host api:127.0.0.1 -p 8080:${{ matrix.port }} smoke-test:${{ matrix.component }}
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080${{ matrix.check }}; then
              echo; echo "✅ L'image répond"; exit 0
            fi
            sleep 2
          done
          echo "❌ L'image ne répond pas, logs du conteneur :"
          docker logs smoke
          exit 1

      - name: Push sur ghcr.io (seulement sur main)
        if: github.event_name == 'push'               # sur une pull request : pas de publication
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}   # tout est en cache : quasi instantané

  # Le lien entre CI et CD : la CI ne touche jamais au cluster, elle modifie seulement Git.
  # Argo CD (dans le cluster) voit ce commit et déploie les nouvelles images.
  deploy:
    needs: build              # seulement si les 2 images sont construites, testées et publiées
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write         # autorise ce job à pousser un commit sur le dépôt
    concurrency: deploy       # deux déploiements ne tournent jamais en même temps
    steps:
      - uses: actions/checkout@v7

      # Le tag publié par le job build (metadata-action, type=sha) : "sha-" + 7 premiers caractères du commit
      - name: Mise à jour du tag des images dans k8s/app/
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          sed -i -E "s#(image: ghcr\.io/.+/to-do_list-api):.*#\1:$TAG#" k8s/app/30-api.yaml
          sed -i -E "s#(image: ghcr\.io/.+/to-do_list-frontend):.*#\1:$TAG#" k8s/app/40-frontend.yaml
          git diff

      # Le commit est fait avec le jeton GITHUB_TOKEN : GitHub ne relance pas de CI pour
      # un push fait avec ce jeton (sinon : boucle infinie build → commit → build → ...).
      # De toute façon il ne touche que k8s/, ignoré par "paths-ignore" plus haut.
      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: images sha-${GITHUB_SHA::7}" || { echo "Rien à changer"; exit 0; }
          git pull --rebase       # au cas où un autre commit est arrivé sur main entre-temps
          git push

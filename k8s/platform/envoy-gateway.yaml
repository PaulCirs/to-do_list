# "Plateforme" : ce que le cluster fournit à toutes les applis (ici, le point d'entrée HTTP).
# Ce n'est pas propre à la to-do list, d'où un dossier à part de k8s/app/.
#
# Gateway API = le successeur officiel de l'Ingress (ingress-nginx est retiré depuis 2026).
# Elle sépare les rôles :
#   - GatewayClass : QUEL logiciel fait le routage (ici Envoy Gateway)    → l'équipe plateforme
#   - Gateway      : un point d'entrée concret (port 80, quels namespaces) → l'équipe plateforme
#   - HTTPRoute    : les règles de routage d'une appli (/api → api, ...)   → l'équipe de l'appli
#
# Pré-requis (une seule fois par cluster) : installer Envoy Gateway, qui apporte
# les CRDs Gateway API + le contrôleur dans le namespace envoy-gateway-system :
#   kubectl apply --server-side -f https://github.com/envoyproxy/gateway/releases/download/v1.9.3/install.yaml
#   kubectl wait --timeout=5m -n envoy-gateway-system deployment/envoy-gateway --for=condition=Available

# EnvoyProxy : réglages des pods Envoy que le contrôleur crée pour chaque Gateway.
# Par défaut il les expose via un Service "LoadBalancer", qui n'existe pas dans kind.
# On demande donc un NodePort fixe 30080, déjà relié à localhost:8080 par kind-config.yaml.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: kind-nodeport
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - port: 80          # le port du listener "http" de la Gateway
                  nodePort: 30080
---
# GatewayClass : "les Gateways de cette classe sont gérées par Envoy Gateway,
# avec les réglages EnvoyProxy ci-dessus".
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: kind-nodeport
    namespace: envoy-gateway-system
---
# Gateway : le point d'entrée du cluster, un listener HTTP sur le port 80.
# allowedRoutes "All" : les HTTPRoute de n'importe quel namespace peuvent s'y rattacher.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All

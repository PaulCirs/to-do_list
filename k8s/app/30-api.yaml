# Deployment : Kubernetes maintient en permanence "replicas" pods identiques de l'API.
# Si un pod meurt, il en recrée un ; si on change l'image, il les remplace progressivement.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: todo
spec:
  replicas: 2   # l'API ne stocke rien localement (tout est dans Postgres) : on peut en lancer plusieurs
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          # Image publiée par la CI, avec le tag du commit dont elle est issue (sha-xxxxxxx).
          # Ne pas modifier à la main : le job "deploy" de la CI met ce tag à jour à chaque build.
          image: ghcr.io/paulcirs/to-do_list-api:sha-9f69402
          ports:
            - containerPort: 8000
          # Readiness : "puis-je recevoir du trafic ?" → /ready vérifie aussi la base.
          # En échec, le pod est retiré du Service (plus de requêtes) mais PAS redémarré.
          # Pendant un déploiement, un nouveau pod ne reçoit du trafic qu'une fois prêt.
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            periodSeconds: 5        # testée toutes les 5 s
            failureThreshold: 2     # 2 échecs de suite (~10 s) → retiré du trafic
          # Liveness : "es-tu encore vivant ?" → /health ne teste PAS la base, exprès :
          # si Postgres tombe, redémarrer les API ne réparerait rien (et les ferait boucler).
          # En échec, le conteneur est redémarré (ex. processus bloqué qui ne répond plus).
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3     # ~30 s sans réponse → redémarrage
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DATABASE_URL
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
# Service : une adresse stable ("api:8000") qui répartit le trafic entre les pods de l'API.
# Le nom "api" est celui qu'utilise déjà le nginx du front (proxy_pass http://api:8000).
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: todo
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000

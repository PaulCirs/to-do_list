# Job : lance un pod qui exécute une tâche JUSQU'AU BOUT puis s'arrête (contrairement à un
# Deployment, qui maintient des pods en vie). Ici : créer les tables (python -m app.migrate).
# Il est dans ce fichier, et pas dans un fichier à part, pour que le job "deploy" de la CI
# mette aussi à jour son tag d'image : migration et API utilisent toujours la même version du code.
#
# Ordre de déploiement avec les "sync waves" d'Argo CD (vague 0 par défaut) :
#   vague 0 : namespace, config, base de données → Argo CD attend qu'elles soient Healthy
#   vague 1 : ce Job                             → Argo CD attend qu'il se termine avec succès
#   vague 2 : API et front                       → ils ne démarrent qu'une fois les tables créées
# Si la migration échoue, le déploiement s'arrête là et l'ancienne API continue de tourner.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: todo
  annotations:
    # "Hook" : Argo CD ne compare pas ce Job à l'état du cluster, il le (re)lance à chaque sync.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    # Supprime le Job précédent juste avant d'en créer un nouveau : le dernier reste visible
    # (kubectl logs job/migrate -n todo) jusqu'au déploiement suivant.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 4             # en cas d'échec, Kubernetes réessaie jusqu'à 4 fois (délai croissant)
  activeDeadlineSeconds: 300  # au-delà de 5 minutes, le Job est considéré en échec
  template:
    spec:
      restartPolicy: Never    # obligatoire pour un Job (Never ou OnFailure) : on ne relance pas un pod qui a fini
      containers:
        - name: migrate
          # Ne pas modifier à la main : mis à jour par la CI, comme l'image du Deployment plus bas.
          image: ghcr.io/paulcirs/to-do_list-api:sha-0870fb1
          command: ["python", "-m", "app.migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DATABASE_URL
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
# Deployment : Kubernetes maintient en permanence "replicas" pods identiques de l'API.
# Si un pod meurt, il en recrée un ; si on change l'image, il les remplace progressivement.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: todo
  annotations:
    argocd.argoproj.io/sync-wave: "2"   # après la migration (voir le Job ci-dessus)
spec:
  # Pas de "replicas" ici : c'est l'HPA (35-api-hpa.yaml) qui choisit le nombre de pods, entre 2 et 5.
  # On peut en lancer plusieurs car l'API ne stocke rien localement (tout est dans Postgres).
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          # Image publiée par la CI, avec le tag du commit dont elle est issue (sha-xxxxxxx).
          # Ne pas modifier à la main : le job "deploy" de la CI met ce tag à jour à chaque build.
          image: ghcr.io/paulcirs/to-do_list-api:sha-0870fb1
          ports:
            - containerPort: 8000
          # Readiness : "puis-je recevoir du trafic ?" → /ready vérifie aussi la base.
          # En échec, le pod est retiré du Service (plus de requêtes) mais PAS redémarré.
          # Pendant un déploiement, un nouveau pod ne reçoit du trafic qu'une fois prêt.
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            periodSeconds: 5        # testée toutes les 5 s
            failureThreshold: 2     # 2 échecs de suite (~10 s) → retiré du trafic
          # Liveness : "es-tu encore vivant ?" → /health ne teste PAS la base, exprès :
          # si Postgres tombe, redémarrer les API ne réparerait rien (et les ferait boucler).
          # En échec, le conteneur est redémarré (ex. processus bloqué qui ne répond plus).
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3     # ~30 s sans réponse → redémarrage
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DATABASE_URL
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
# Service : une adresse stable ("api:8000") qui répartit le trafic entre les pods de l'API.
# Le nom "api" est celui qu'utilise déjà le nginx du front (proxy_pass http://api:8000).
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: todo
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000

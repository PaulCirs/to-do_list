apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: todo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: nginx
          image: ghcr.io/paulcirs/to-do_list-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
---
# Service interne (ClusterIP, le type par défaut) : seule la Gateway est exposée
# hors du cluster, elle envoie ici le trafic grâce à l'HTTPRoute (50-route.yaml).
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: todo
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80

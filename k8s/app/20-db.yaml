# Service "headless" (clusterIP: None) : pas d'IP virtuelle, le nom DNS "db"
# pointe directement sur le pod Postgres. C'est le Service exigé par un StatefulSet.
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: todo
spec:
  clusterIP: None
  selector:
    app: db
  ports:
    - port: 5432
---
# StatefulSet plutôt que Deployment pour une base de données :
#  - nom de pod stable (db-0, et non db-7f9c8-xk2p) ;
#  - chaque réplica garde SON propre disque (volumeClaimTemplates), même s'il est recréé.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: todo
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db   # doit correspondre au selector ci-dessus et à celui du Service
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
            - containerPort: 5432
          # Injecte toutes les clés du ConfigMap et du Secret comme variables d'environnement
          envFrom:
            - configMapRef:
                name: db-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql   # même chemin que le volume de docker-compose
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
  # Pour chaque pod, Kubernetes crée un PersistentVolumeClaim "data-db-0".
  # kind fournit une StorageClass par défaut qui crée le disque automatiquement.
  # Le PVC survit à la suppression du pod ET du StatefulSet : les données restent.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

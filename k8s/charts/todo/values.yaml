# Les valeurs du chart : tout ce qu'on veut pouvoir changer SANS toucher aux modèles.
# Dans les modèles, on les lit avec {{ .Values.<chemin> }}, ex. {{ .Values.image.tag }}.
#
# Intérêt : pour un 2e environnement (ex. staging), on garderait les mêmes modèles et on
# ne changerait que quelques valeurs (moins de pods, autre mot de passe...).

image:
  registry: ghcr.io/paulcirs
  # Tag commun aux images api et frontend, construites depuis le même commit.
  # Ne pas modifier à la main : le job "deploy" de la CI met ce tag à jour à chaque build.
  tag: sha-7a17bc3

db:
  image: postgres:18-alpine
  user: todo
  name: todo
  # Identifiants de la base : CHIFFRÉS avec la clé publique du cluster (Sealed Secrets).
  # Seul le contrôleur du cluster peut les déchiffrer : ils peuvent donc être dans Git, même public.
  # Le contrôleur en fait le Secret "secretName" (POSTGRES_PASSWORD et DATABASE_URL).
  # Générés par : .\scripts\seal-db-credentials.ps1 (à relancer si le cluster est recréé).
  credentials:
    secretName: db-credentials-v2
    encryptedData:
      DATABASE_URL: 
      POSTGRES_PASSWORD: 
  storage: 1Gi
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }

api:
  # Pas de nombre de pods fixe : c'est l'HPA qui décide, entre ces deux bornes.
  autoscaling:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70   # en % de resources.requests.cpu
    scaleDownStabilizationSeconds: 60     # 300 par défaut ; réduit pour voir l'effet en test
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

frontend:
  replicas: 1
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }

# Gateway (définie dans k8s/platform/) à laquelle l'HTTPRoute se rattache.
gateway:
  name: main
  namespace: envoy-gateway-system

# ConfigMap : configuration NON sensible, lisible par tous.
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-config
  namespace: {{ .Release.Namespace }}
data:
  POSTGRES_USER: {{ .Values.db.user }}
  POSTGRES_DB: {{ .Values.db.name }}
---
# SealedSecret : un Secret CHIFFRÉ, qu'on peut donc versionner dans Git.
# On ne crée plus le Secret nous-mêmes : le contrôleur Sealed Secrets (k8s/argocd/sealed-secrets.yaml)
# lit ce SealedSecret, le déchiffre avec la clé privée du cluster et crée le Secret
# "{{ .Values.db.credentials.secretName }}", utilisé ensuite normalement par la base, l'API et la migration.
#
# Pourquoi "-v2" ? L'ancien Secret "db-credentials" (mot de passe "todo", public dans
# l'historique Git) était créé par Argo CD. Un nouveau nom évite que le contrôleur et
# Argo CD se disputent la même ressource ; l'ancien est supprimé par Argo CD (prune).
#
# Pour changer le mot de passe : .\scripts\seal-db-credentials.ps1, puis coller le résultat
# dans values.yaml (db.credentials.encryptedData).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.db.credentials.secretName }}
  namespace: {{ .Release.Namespace }}
spec:
  encryptedData: {{- toYaml .Values.db.credentials.encryptedData | nindent 4 }}
  # Modèle du Secret que le contrôleur va créer (nom, namespace, type)
  template:
    metadata:
      name: {{ .Values.db.credentials.secretName }}
      namespace: {{ .Release.Namespace }}
    type: Opaque

# Application Argo CD "todo-app" : déploie k8s/app/ (namespace, config, db, api, frontend, route).
# Mêmes principes que platform.yaml : voir les explications dans ce fichier.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/PaulCirs/to-do_list.git
    targetRevision: main
    path: k8s/app
  destination:
    server: https://kubernetes.default.svc
    namespace: todo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

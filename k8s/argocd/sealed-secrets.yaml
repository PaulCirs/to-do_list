# Application Argo CD "sealed-secrets" : le contrôleur qui déchiffre les SealedSecrets.
#
# Problème résolu : un Secret Kubernetes n'est qu'encodé (base64), pas chiffré. Le mettre
# dans Git (dépôt public !) revient à publier le mot de passe.
#
# Principe (chiffrement asymétrique, comme HTTPS) :
#   1. au démarrage, le contrôleur génère une paire de clés et garde la clé PRIVÉE dans le cluster ;
#   2. sur ton PC, l'outil "kubeseal" chiffre un Secret avec la clé PUBLIQUE
#      → on obtient un "SealedSecret", illisible, qu'on peut commiter sans risque ;
#   3. dans le cluster, le contrôleur le déchiffre avec la clé privée et crée le vrai Secret.
# Seul CE cluster peut déchiffrer : même avec le dépôt, personne d'autre ne lit le mot de passe.
#
# ATTENTION : si le cluster est supprimé (kind delete cluster), la clé privée disparaît avec
# lui et les SealedSecrets du dépôt deviennent indéchiffrables : il faudra les rechiffrer avec
# la clé du nouveau cluster. (En production, on sauvegarde cette clé en lieu sûr.)
#
# À enregistrer une fois :
#   kubectl apply -f k8s/argocd/sealed-secrets.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets   # (anciennement bitnami-labs.github.io)
    chart: sealed-secrets
    targetRevision: 2.22.0       # version du chart ; contrôleur sealed-secrets 0.41.2
    helm:
      valuesObject:
        # Nom attendu par défaut par kubeseal (contrôleur "sealed-secrets-controller" dans
        # kube-system) : ainsi pas besoin de lui préciser où trouver le contrôleur.
        fullnameOverride: sealed-secrets-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

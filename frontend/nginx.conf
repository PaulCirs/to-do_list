server {
    listen 80;

    # Les fichiers du front (index.html, app.js, style.css)
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Tout ce qui commence par /api part vers l'API.
    # "api" est le nom du service dans docker-compose : Docker le résout en adresse IP.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
